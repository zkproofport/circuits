[package]
name = "oidc_libs"
type = "lib"
version = "0.1.0"
authors = ["zkproofport"]

# Everything oidc_domain_attestation checks except WHO vouched for the
# provider key: the JWT signature, the claims, the nullifier and the
# provider-key statement's bytes. Shared by the circuit packages that serve
# the circuit id `oidc_domain_attestation` -- oidc-domain-attestation (iPhone
# App Attest or the AI server) and oidc-domain-attestation-android (Android
# key attestation) -- so both prove exactly the same statement about a token.
# It does not depend on ../statement-signer, so a synthetic-anchors copy of a
# circuit replaces only the signer.
[dependencies]
jwt = { path = "../deps/noir-jwt" }
keccak256 = { path = "../deps/keccak256" }
base64 = { git = "https://github.com/noir-lang/noir_base64", tag = "v0.4.2" }
string_search = { git = "https://github.com/noir-lang/noir_string_search", tag = "v0.3.3" }
