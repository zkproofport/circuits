[package]
name = "trust_anchor"
type = "lib"
version = "0.1.0"
authors = ["zkproofport"]

# keccak256 v0.1.1 is what coinbase-libs uses; poseidon v0.2.6 is what
# app-attest-libs already pulls in through zkpassport noir-bignum v0.9.2-1.
# Both compile on nargo 1.0.0-beta.19.
[dependencies]
keccak256 = { tag = "v0.1.1", git = "https://github.com/noir-lang/keccak256" }
poseidon = { tag = "v0.2.6", git = "https://github.com/noir-lang/poseidon" }
