[package]
name = "coinbase_country_v2_libs"
type = "lib"
version = "0.1.0"
authors = ["zkproofport"]

# Everything coinbase_country_attestation v2 checks except WHO signed the
# revocation statement: the wallet's signature over the request, Coinbase's
# attestCountry transaction, the country list, the 227-byte statement and the
# nullifier tag. Shared by the three packages serving the id
# (coinbase-country-attestation-v2: iPhone App Attest or the AI server;
# -android: Android key attestation; -android-factory: factory Android + Play
# Integrity). Does not depend on ../statement-signer, so a synthetic-anchors
# copy of a circuit replaces only the signer.
#
# A sibling of ../coinbase-v2-libs rather than a change to it: that library is
# in the file map of every coinbase_attestation v2 artifact, so editing it
# would change the KYC circuit files the app, SDK and AI server already pin
# (same constraints, different bytes).
[dependencies]
keccak256 = { path = "../deps/keccak256" }
coinbase_libs = { path = "../coinbase-libs" }
