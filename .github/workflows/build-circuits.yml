name: Build circuits

# Why this exists
#
# Until now every circuit artifact in this repository was built by hand on
# whoever's laptop and committed from there. Two things went wrong because of
# that, both found on 2026-09-04:
#
#   * The committed artifacts were stale. They were built 2026-02-02, and the
#     keccak256 dependency was vendored into deps/ on 2026-05-01. Nobody
#     rebuilt after that, so the committed .json no longer matches what the
#     current Nargo.toml set produces — on any machine.
#   * Rebuilding produced a dirty tree even when nothing had changed, because
#     nargo records the absolute path of every source file it read. The
#     artifacts carry the previous machine's account name.
#
# Running the build here fixes both: the path is always the same, and the
# verify job fails the moment the committed artifacts drift from the source.
# (build.sh also normalizes those embedded paths, so a local build and a CI
# build agree byte for byte — that is what makes verifying meaningful.)

on:
  workflow_dispatch:
    inputs:
      commit_artifacts:
        description: 'Commit the rebuilt artifacts back to this branch'
        type: boolean
        default: false
  pull_request:
    paths:
      - '**/src/**.nr'
      - '**/Nargo.toml'
      - 'deps/**'
      - 'scripts/build.sh'
      - 'scripts/write-digests.sh'
      - 'scripts/normalize-artifact-paths.py'
      - '.github/workflows/build-circuits.yml'
      - 'toolchain.env'
      - 'scripts/install-toolchain.sh'

# The version lock lives in toolchain.env (nargo, bb, and the noir-rs the phone
# proves with); this workflow installs exactly that set with the same script a
# developer runs, so CI and a laptop cannot disagree about versions.
jobs:
  build:
    runs-on: ubuntu-latest
    # The repository's default token is read-only; committing the rebuilt
    # artifacts back (commit_artifacts) needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned nargo and bb (toolchain.env)
        run: |
          ./scripts/install-toolchain.sh
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"

      # Which circuits ship comes from the customer SDK's key-path table
      # (write-digests.sh, check-shipped-circuits.sh). This repository is
      # checked out alone here, so read the SDK as customers get it: from npm.
      # The `beta` dist-tag, not `latest`: circuits ship to the release being
      # prepared, which is published as beta first, and `latest` lags it by a
      # whole release. On 2026-10-30 `latest` was 0.4.3, which still listed
      # the Korean mobile ID circuits removed on 2026-10-29, so every build
      # after their removal failed here. Promotion moves `latest` to a version
      # that was `beta`, so beta is never behind latest.
      - name: Read the shipped circuit list from the published SDK
        run: |
          # Installed, not unpacked: since 0.5.0-beta the SDK's circuits.js
          # re-exports @zkproofport-app/core, so it only loads with its
          # dependencies beside it.
          sdk="$RUNNER_TEMP/sdk"
          mkdir -p "$sdk"
          npm install --prefix "$sdk" --no-audit --no-fund --ignore-scripts @zkproofport-app/sdk@beta >/dev/null
          echo "SDK_CIRCUITS_JS=$sdk/node_modules/@zkproofport-app/sdk/dist/circuits.js" >> "$GITHUB_ENV"

      # build.sh writes each circuit's SRS with noir-rs's srs_downloader
      # (scripts/generate_srs.sh), a Rust build of several minutes; keep the
      # clone and its target between runs, keyed by the pinned noir-rs tag.
      - name: Cache the noir-rs SRS tool
        uses: actions/cache@v4
        with:
          path: ~/.cache/noir-rs-tags
          key: noir-rs-srs-${{ hashFiles('toolchain.env') }}

      - name: Build every circuit
        run: |
          # Circuits with their own acceptance tests re-build themselves many
          # times; that belongs in a separate run, not in the artifact check.
          # coinbase-attestation-v2, coinbase-country-attestation-v2,
          # oidc-domain-attestation and their -android packages share the
          # statement-signer library, so all of them are rebuilt when it changes. The -android ones are 2^21: build.sh
          # publishes their reference strings in parts (GitHub's file limit).
          for dir in coinbase-attestation coinbase-attestation-v2 coinbase-country-attestation \
                     giwa-attestation dojang-playground oidc-domain-attestation \
                     oidc-domain-attestation-android coinbase-attestation-v2-android \
                     oidc-domain-attestation-android-factory coinbase-attestation-v2-android-factory \
                     coinbase-country-attestation-v2 coinbase-country-attestation-v2-android \
                     coinbase-country-attestation-v2-android-factory \
                     human-passport-score \
                     zktls; do
            echo "::group::$dir"
            SKIP_POST_BUILD=1 ./scripts/build.sh "$dir"
            echo "::endgroup::"
          done

      - name: Fail if a shipped circuit is missing from the build list above
        run: ./scripts/check-shipped-circuits.sh

      - name: Publish digests for what the app downloads
        # Exits non-zero when a shipped circuit has no reference string, no
        # verifying key, or no manifest. All three are required: without a .srs
        # no device can prove, without a vk none can verify what it proved, and
        # without a manifest the app checks the download by BYTE COUNT, which a
        # file truncated at exactly the right length passes.
        run: ./scripts/write-digests.sh

      - name: Refuse to publish an incomplete set
        run: ./scripts/write-digests.sh --check

      - name: Fail if the committed artifacts are out of date
        if: ${{ github.event_name == 'pull_request' || !inputs.commit_artifacts }}
        run: |
          if git diff --quiet; then
            echo "Committed artifacts match a clean rebuild."
            exit 0
          fi
          echo "::error::Committed circuit artifacts do not match a rebuild from source."
          echo "Rebuild locally and commit the result:"
          echo "  ./scripts/build.sh <circuit>   # for each changed circuit"
          echo "  ./scripts/write-digests.sh"
          echo
          echo "What differs:"
          git diff --stat
          # Show the fields that differ rather than a wall of minified JSON, so
          # a reader can tell a real circuit change from metadata churn.
          for f in $(git diff --name-only -- '*/target/*.json' '*/*/target/*.json'); do
            echo "::group::$f"
            python3 - "$f" <<'PY'
          import json, subprocess, sys
          path = sys.argv[1]
          old = json.loads(subprocess.run(['git','show',f'HEAD:{path}'],
                                          capture_output=True, text=True).stdout)
          new = json.load(open(path))
          for key in sorted(set(old) | set(new)):
              same = old.get(key) == new.get(key)
              print(f"  {key:16} {'same' if same else 'DIFFERENT'}")
          PY
            echo "::endgroup::"
          done
          exit 1

      - name: Commit the rebuilt artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_artifacts }}
        run: |
          if git diff --quiet; then
            echo "Nothing to commit — artifacts already match."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A glob pathspec matches FILE paths: '*/target' names no file and
          # made git stop here with "did not match any files" after every
          # circuit had built.
          git add -A ':(glob)**/target/**'
          git commit -m "chore(circuits): rebuild artifacts with the pinned toolchain"
          git push

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-artifacts
          path: |
            */target/*.json
            */target/vk/vk
            */target/*.sol
            */target/SHA256SUMS
            */target/vk/SHA256SUMS
          if-no-files-found: error
