[package]
name = "app_attest"
type = "lib"
version = "0.1.0"
authors = ["zkproofport"]

# P-384 comes from zkPassport's noir-ecdsa stack, at the newest tags that still
# compile on nargo 1.0.0-beta.19 (bignum v0.9.2-1 states a minimum of beta.18;
# the next tags need beta.24 or a nightly). Checked 2026-10-23:
#   noir-ecdsa     v0.3.0    a tag of zkpassport/noir-ecdsa
#   noir-bignum    v0.9.2-1  zkpassport/noir-bignum
#   noir_bigcurve  v0.13.2-1 zkpassport/noir_bigcurve
# The older forks in ../deps/zkp-* (v0.7.3 era) no longer compile on beta.19.
# P-256 does not need them: std::ecdsa_secp256r1 is a Barretenberg black box.
# SHA-384 (Apple's root signs the intermediate with ecdsa-with-SHA384) comes
# from zkpassport/sha512 v0.1.1, the version deps/noir_rsa already pins.
[dependencies]
ecdsa = { tag = "v0.3.0", git = "https://github.com/zkpassport/noir-ecdsa" }
bignum = { tag = "v0.9.2-1", git = "https://github.com/zkpassport/noir-bignum" }
bigcurve = { tag = "v0.13.2-1", git = "https://github.com/zkpassport/noir_bigcurve" }
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
sha512 = { tag = "v0.1.1", git = "https://github.com/zkpassport/sha512" }
