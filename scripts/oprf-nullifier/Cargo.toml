[package]
name = "oprf-fixture"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test inputs for the circuits' OPRF nullifier (oprf-nullifier-libs), from TACEO's crates and a local test key. No network."

# The same crate versions as ../../../proofport-oprf (TaceoLabs/oprf-testnet
# v0.4.0 locks these), so the fixtures come from the code the service runs.
[dependencies]
taceo-oprf-core = { version = "=0.6.3", default-features = false, features = ["server"] }
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.6" }
poseidon2 = { package = "taceo-poseidon2", version = "=0.3.1", default-features = false, features = ["bn254", "t3", "t4"] }
ark-ec = "0.6"
ark-ff = "0.6"
num-bigint = "0.4"
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1"
eyre = "0.6"
