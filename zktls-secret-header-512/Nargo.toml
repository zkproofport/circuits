[package]
name = "zktls_secret_header_512"
type = "bin"
authors = ["zkproofport"]
compiler_version = ">=1.0.0"

# The 512 tier of the secret header value proof: a hidden Authorization or Cookie
# value of at most 512 bytes opens its TLSNotary commitment and holds no control byte.
# All logic is in ../zktls-secret-header-libs.
[dependencies]
zktls_secret_header_libs = { path = "../zktls-secret-header-libs" }
